<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alisha Faraz for Vice Chair</title>
    <!-- Link to Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            text-align: center;
        }

        .container {
            position: relative;
            background: url('path_to_your_image.png') center center no-repeat;
            background-size: cover;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 4em;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            gap: 20px;
        }

        .btn {
            padding: 15px 25px;
            font-size: 1.2em;
            background-color: rgba(0, 255, 255, 0.6);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            font-family: 'Orbitron', sans-serif;
        }

        .btn:hover {
            background-color: rgba(0, 255, 255, 1);
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Alisha Faraz for Vice Chair</h1>
        <div class="buttons">
            <a href="info.html">
                <button class = "btn">Campaign Platform</button>
            </a>  
            <a href="game.html">
                <button class = "btn">Play</button>
            </a>  
        </div>
    </div>
</body>
</html>
